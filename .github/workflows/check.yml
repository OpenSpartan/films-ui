name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege: this workflow only reads source. A dependency's install
# script could otherwise push with the persisted checkout credential.
permissions:
  contents: read

# The job runs on the runner the repository variable RUNNER names (for
# example `self-hosted`), else on GitHub's. Pull requests from forks always
# run on GitHub's.

jobs:
  check:
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNNER == '') && 'ubuntu-latest' || vars.RUNNER }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # --ignore-scripts: neither TypeScript nor the runtime dependencies need
      # an install script.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
